"$schema" = "https://starship.rs/config-schema.json"

scan_timeout = 120
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$python\
$fill\
$cmd_duration
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style)) '
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold cyan"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"

[fill]
symbol = " "

[cmd_duration]
min_time = 500
format = "[$duration]($style) "
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"
